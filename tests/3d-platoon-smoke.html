<!doctype html>
<meta charset="utf-8">
<title>Crossroads 3D platoon smoke</title>
<pre id="out">Checking the first platoon…</pre>
<script src="../data/scenarios.js"></script>
<script src="../data/unit-types.js"></script>
<script src="../data/formations.js"></script>
<script src="../data/faction-kits.js"></script>
<script src="../data/terrain.js"></script>
<script src="../src/presentation/miniatures.js"></script>
<script src="../src/rules/movement.js"></script>
<script src="../src/diorama/study-bridge.js"></script>
<script src="../src/diorama/study-motion.js"></script>
<script>
"use strict";
(() => {
  const b=window.CrossroadsDioramaBridge;
  const motion=window.CrossroadsDioramaMotion;
  const results=[];
  const test=(name,condition)=>{
    results.push((condition?"PASS":"FAIL")+" "+name);
  };
  const units=b.createStudyUnits();
  const sum=units.reduce((n,u)=>n+u.soldiers,0);
  test("Four authored units",units.length===4);
  test("Four independent ids",new Set(units.map(u=>u.id)).size===4);
  test("Twenty miniatures",sum===20);
  test("Two Polish and two German units",units.filter(u=>u.kitId==="poland_1939").length===2&&units.filter(u=>u.kitId==="germany_1939").length===2);
  test("Every unit uses actual formation slots",units.every(u=>b.slotsFor(u).length===u.soldiers));
  test("Officer role and equipment",units[1].role==="officer"&&units[1].weapons.pistol===2);
  test("Assault squad retains three SMGs",b.slotsFor(units[3]).filter(s=>s.recipe.role==="smg").length===3);
  test("German rifle LMG present",b.slotsFor(units[2])[0].recipe.role==="lmg");
  const dist=(u,v)=>Math.hypot(u.x-v.x,u.y-v.y);
  test("Initial squads respect 3.4 inch separation",units.every((u,i)=>units.every((v,j)=>i===j||dist(u,v)>=3.4)));
  const getUnits=()=>units;
  const moving=b.createMovementController(units[0],[],getUnits);
  const blocked=moving.planMove(b.toWorld(units[1]));
  test("Squad collision uses live movement rules",!blocked.legal&&blocked.kind==="collision");
  const start=b.toWorld(units[0]);
  const legal=moving.planMove({x:start.x+.27,z:start.z});
  test("Advance legal in open ground",legal.legal&&legal.cost>0);
  const before=units.slice(1).map(u=>({x:u.x,y:u.y}));
  moving.commitMove(legal);
  test("Other squads never move on unit commit",units.slice(1).every((u,i)=>u.x===before[i].x&&u.y===before[i].y));
  const gaits=Array.from({length:6},(_,i)=>motion.gaitFor(0,i));
  test("Slight unique soldier pacing",new Set(gaits.map(g=>g.pace.toFixed(4))).size>=5);
  test("Walking variation stays within plus or minus 7.5%",gaits.every(g=>g.pace>=.925-1e-9&&g.pace<=1.075+1e-9));
  const last=motion.finishTime(1.7,gaits);
  test("All walkers converge exactly at end",gaits.every(g=>motion.progressFor(last,1.7,g)===1));
  const turns=motion.makeTurn([-.5,-.1,.1,.3,.5,.7],2);
  test("Independent turn timings",new Set(turns.turns.map(t=>t.fraction)).size===6);
  test("All soldier headings arrive",turns.turns.every(t=>Math.abs(Math.atan2(Math.sin(motion.headingAt(t,1)-2),Math.cos(motion.headingAt(t,1)-2)))<1e-7));
  const passed=results.filter(r=>r.startsWith("PASS")).length;
  document.getElementById("out").textContent=results.join("\n")+"\n\n"+passed+"/"+results.length+" passed";
  if(passed!==results.length)document.body.style.background="#633";
})();
</script>
