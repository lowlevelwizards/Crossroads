name: Crossroads Node and 3D regressions

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original rules, 3D presentation and release integrity
        run: node tests/run-all-node.js
