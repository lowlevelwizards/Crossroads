<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#212b29">
  <title>Crossroads — Live 3D Battle</title>
  <link rel="stylesheet" href="src/diorama/diorama.css?v=0.4.1">
  <link rel="stylesheet" href="src/diorama/battle-controls.css?v=0.6.0">
</head>
<body>
  <main class="experience" aria-label="Crossroads 3D miniature battlefield">
    <div class="stage" id="stage">
      <canvas id="dioramaCanvas" aria-label="3D miniature tabletop. One-finger drag orbits, two-finger drag pans, pinch zooms. Tap a squad to select and ground to move."></canvas>
      <div class="stage-vignette" aria-hidden="true"></div>
      <div id="loadingState" class="loading-state" role="status">Preparing the tabletop…</div>
      <span class="version-label" aria-label="Crossroads 3D battle version 0.6.0">3D v0.6.0</span>
    </div>
  </main>
  <script src="data/scenarios.js"></script>
  <script src="data/unit-types.js"></script>
  <script src="data/formations.js"></script>
  <script src="data/faction-kits.js"></script>
  <script src="data/terrain.js"></script>
  <script src="src/presentation/miniatures.js"></script>
  <script src="src/rules/movement.js"></script>
  <script src="src/diorama/study-bridge.js?v=0.4.1"></script>
  <script src="src/diorama/study-motion.js?v=0.4.1"></script>
  <script src="src/diorama/study-gestures.js?v=0.4.1"></script>
  <script src="src/rules/terrain-semantics.js"></script>
  <script src="src/rules/terrain-spatial.js"></script>
  <script src="data/linear-terrain.js"></script>
  <script src="src/scenario/scenario-visibility.js"></script>
  <script src="src/rules/path-geometry.js"></script>
  <script src="src/rules/linear-terrain.js"></script>
  <script src="src/rules/terrain-geometry.js"></script>
  <script src="src/diorama/scenario-adapter.js?v=0.4.1"></script>
  <script src="src/diorama/scale-spec.js?v=0.4.1"></script>
  <aside id="battleControls" class="battle-controls" aria-live="polite">
    <span class="battle-loading">Connecting to the Crossroads battle coordinator…</span>
  </aside>
  <iframe id="battleSessionFrame" class="battle-session-frame" src="classic-session.html?scenario=hold_the_farm&amp;v=0.6.0"
    aria-label="Crossroads authoritative rules coordinator" tabindex="-1"></iframe>
  <script src="src/diorama/battle-client.js?v=0.6.0"></script>
  <script type="module" src="src/diorama/scenario-scene.js?v=0.6.0"></script>
</body>
</html>
